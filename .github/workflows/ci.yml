name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so a quick second push doesn't queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        # Runtime-only secrets; the DB client is lazy and all routes are dynamic,
        # so these placeholders just keep the build deterministic — they are never
        # used to connect or sign anything during `next build`.
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
          ANTHROPIC_API_KEY: sk-ant-ci-placeholder
          SESSION_SECRET: ci-placeholder-session-secret-not-used-at-build
        run: npm run build
